<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Omni-Ask · 全提问</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 380px;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #0f1420;
    color: #e6e9f0;
    padding: 14px;
  }
  header { margin-bottom: 10px; }
  h1 { font-size: 16px; display: inline; }
  .sub { font-size: 11px; color: #8b93a7; margin-left: 6px; }
  textarea {
    width: 100%;
    height: 88px;
    resize: vertical;
    border-radius: 8px;
    border: 1px solid #2a3350;
    background: #171e30;
    color: #e6e9f0;
    padding: 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  textarea:focus { outline: 2px solid #4f7cff; border-color: transparent; }
  button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4f7cff;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #3d6bef; }
  button:disabled { opacity: .5; cursor: default; }
  #targets { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
  .hint { font-size: 12px; color: #8b93a7; line-height: 1.6; }
  .tab {
    font-size: 12px;
    background: #171e30;
    border: 1px solid #232c47;
    border-radius: 6px;
    padding: 6px 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab b { color: #9db4ff; }
  .tab span { color: #8b93a7; margin-left: 4px; }
  #status { margin-top: 10px; font-size: 12px; line-height: 1.7; }
  .ok { color: #57d9a3; }
  .bad { color: #ff7b72; }
</style>
</head>
<body>
  <header>
    <h1>Omni-Ask</h1>
    <span class="sub">全提问 · Enter 发送 / Shift+Enter 换行</span>
  </header>
  <textarea id="q" placeholder="输入要同时提问的内容…"></textarea>
  <button id="ask">分发提问</button>
  <div id="targets"></div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
